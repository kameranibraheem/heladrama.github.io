<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة مشغل الفيديو</title>
    
    <!-- مكتبة HLS ومكتبة Fluid Player -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>

    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; padding: 20px; }
        .player-box { max-width: 800px; margin: 0 auto; position: relative; padding-top: 56.25%; }
        .player-box video, .player-box .fluid_video_wrapper { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

    <h2>اختبار إعلان الفيديو على الآيفون</h2>

    <div class="player-box">
        <video id="test-player" controls playsinline webkit-playsinline>
            <source src="https://vz-f08fe342-443.b-cdn.net/ad861e8b-c3a0-451f-ac9d-c726d95583b5/playlist.m3u8" type="application/x-mpegURL" />
        </video>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var myPlayer = fluidPlayer('test-player', {
                layoutControls: {
                    fillToContainer: true,
                    responsive: true,
                    autoPlay: false
                },
                vastOptions: {
                    allowShortcode: true,
                    adList: [
                        {
                            roll: 'preRoll',
                            /* إعلان جوجل التجريبي */
                            vastTag: 'https://pubads.g.doubleclick.net/gampad/ads?sz=640x480&iu=/12431908/advp_sdk_demo&ciu_szs=300x250&impl=s&gdfp_req=1&env=vp&output=vast&unviewed_position_start=1&submodel=2'
                        }
                    ]
                }
            });
        });
    </script>

</body>
</html>
