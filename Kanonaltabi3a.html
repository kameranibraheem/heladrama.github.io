<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الفيديو</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .main-container {
            width: 100%;
            max-width: 900px;
            background-color: #1e1e1e;
            padding: 20px;
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .video-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
            border-bottom: 2px solid #ff5722;
            padding-bottom: 10px;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .description-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border-left: 4px solid #ff5722;
        }
        .description-box h3 {
            margin-top: 0;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="video-title"> قانون الطبيعة الحلقة 8 مترجمة</div>
    
    <div class="video-wrapper">
        <iframe src="https://w.anaplayer.online/albaplayer/doganin-kanunu-2026-s01e07/?serv=0" allowfullscreen></iframe>
    </div>

    <div class="description-box">
        <h3>تفاصيل الحلقة</h3>
        <p>هنا يمكنك كتابة وصف مختصر عن محتوى هذه الحلقة حتى يتمكن الزائر من معرفة تفاصيل ما يشاهده.</p>
    </div>
</div>

</body>
</html>
