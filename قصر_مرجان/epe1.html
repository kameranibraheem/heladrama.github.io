<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مشاهدة الفيديو</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .player {
      width: 100%;
      max-width: 1000px;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      z-index: 5;
    }

    .watch-button {
      border: 0;
      border-radius: 50px;
      padding: 16px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #fff;
      color: #000;
    }

    .watch-button:active {
      transform: scale(0.97);
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="player">

    <div class="video-box">

      <!-- شاشة البداية -->
      <div class="start-screen" id="startScreen">
        <button class="watch-button" id="watchButton">
          ▶ مشاهدة الفيديو
        </button>
      </div>

      <!-- فيديو Viddler -->
      <iframe
        id="videoFrame"
        src="about:blank"
        data-src="https://viddler.com/embed/player?id=17347&color=default"
        allow="autoplay; fullscreen"
        allowfullscreen
        title="Mercan Köşk Trailer: New Turkish Drama Series on ATV">
      </iframe>

    </div>

  </div>

</div>

<!-- Monetag Popunder -->
<script>
(function(s){
  s.dataset.zone='11237068';
  s.src='https://al5sm.com/tag.min.js'
})([document.documentElement, document.body]
  .filter(Boolean)
  .pop()
  .appendChild(document.createElement('script')));
</script>

<script>
  const button = document.getElementById('watchButton');
  const screen = document.getElementById('startScreen');
  const frame = document.getElementById('videoFrame');

  button.addEventListener('click', function () {

    // تحميل فيديو Viddler بعد الضغط
    frame.src = frame.dataset.src;

    // إخفاء شاشة البداية
    screen.classList.add('hidden');

  });
</script>

</body>
</html>
